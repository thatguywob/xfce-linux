name: Build xfce-linux (Multi-Runner)

# Planning + core + parallel dependency chunks are a shared reusable
# workflow (tuna-os/bst-ci) — identical across every BuildStream desktop
# repo except image name/target/chunk count. build_final (export, sign,
# push) stays here: it owns the signing key and the GHCR push, and
# README.md's verify instructions point at the public key it signs with.

on:
  # No push trigger: this build takes hours and we don't need a fresh run
  # on every commit — the daily schedule is enough. Use workflow_dispatch
  # to build on demand.
  schedule:
    # Daily at 23:30 UTC (5:00 AM IST) — early morning, 1h before tromso's
    # slot to reduce org-wide runner contention (#93).
    - cron: '30 23 * * *'
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push OCI image to GHCR'
        type: boolean
        default: true
      num_chunks:
        description: 'Number of parallel dependency chunks'
        type: string
        default: '10'

env:
  IMAGE_NAME: xfce-linux
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  BST_TARGET: oci/xfce-linux.bst
  BST2_IMAGE: registry.gitlab.com/freedesktop-sdk/infrastructure/freedesktop-sdk-docker-images/bst2:64eb0b4930d57a92710822898fb73af6cc1ae35d

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # This build regularly takes multiple hours; main gets pushed to several
  # times a day. cancel-in-progress:true meant every push evicted whatever
  # build was in flight, so the pipeline effectively never completed (#66).
  # Queue instead: the next run just picks up the latest HEAD when its turn
  # comes, rather than restarting from scratch on every intervening push.
  cancel-in-progress: false

jobs:
  # ── Phase 1-3: Plan, core, parallel dependency chunks ────────────────
  multirunner:
    uses: tuna-os/bst-ci/.github/workflows/multirunner-build.yml@main
    permissions:
      contents: read
      packages: write
    with:
      image_name: xfce-linux
      bst_target: oci/xfce-linux.bst
      num_chunks: ${{ inputs.num_chunks || '10' }}
      core_split: "200"
      # Elements that several chunks each rebuilt from scratch in run
      # 31228685898, with the measured cost of one build and how many of the
      # ten chunks paid it. Building them in core instead puts them in the
      # shared core CAS that every chunk restores, so they are built once.
      #
      #   webkit2gtk-4.1   252 min x 3 chunks   (93% of a chunk's 270 min budget)
      #   webkitgtk-6.0    unfinished on 2 chunks when they hit the budget
      #   llvm             125 min x 4 chunks
      #   rust              37 min x 4 chunks
      #   mozjs             14 min x 2 chunks
      #   cargo-c           13 min x 4 chunks
      #   glycin            13 min x 2 chunks
      #   samba             12 min x 2 chunks
      #   gdb               11 min x 2 chunks
      #
      # mesa's private LLVM is a second full LLVM build that no chunk got far
      # enough to reach; it is here so it is never paid ten times over.
      #
      # Naming an element builds its whole transitive closure, so this list is
      # the shared spine, not just these leaves. It does not change the chunk
      # matrix — chunk names and cache keys still come from core_split alone,
      # so the warm GHCR chunk caches survive this change.
      #
      # qemu/libvirt added 2026-08-14 (#95): run 31653236292's planning-phase
      # matrix (multirunner / planning job log) assigns
      # gnome-build-meta.bst:core-deps/qemu.bst as a named leaf target of
      # chunk3-popt and gnome-build-meta.bst:core-deps/libvirt.bst of
      # chunk5-pwquality — those are 2 of the 4 chunks that hard-failed that
      # run at exactly the 270-minute chunk build budget (signal 15, exit
      # 124; chunks have no soft-budget option the way core does, so hitting
      # the budget is a hard failure, not a warning). I could not get a
      # precise per-element minute count the way the entries above have one
      # (no live BuildStream environment to profile with) — this is a
      # correlation (their owning chunks are 2 of the 4 that timed out), not
      # a proven single cause, and it will not by itself fix chunk4-cracklib
      # or chunk7-cryptsetup-base, which hit the same budget without an
      # equally obvious single heavy leaf target in their list. Flagging
      # that honestly rather than presenting this as a full fix.
      extra_core_targets: >-
        gnome-build-meta.bst:sdk/webkit2gtk-4.1.bst
        gnome-build-meta.bst:sdk/webkitgtk-6.0.bst
        freedesktop-sdk.bst:components/llvm.bst
        freedesktop-sdk.bst:components/rust.bst
        freedesktop-sdk.bst:extensions/mesa/llvm.bst
        gnome-build-meta.bst:sdk/mozjs.bst
        freedesktop-sdk.bst:components/cargo-c.bst
        gnome-build-meta.bst:sdk/glycin.bst
        gnome-build-meta.bst:core-deps/samba.bst
        freedesktop-sdk.bst:components/gdb.bst
        gnome-build-meta.bst:core-deps/qemu.bst
        gnome-build-meta.bst:core-deps/libvirt.bst
      # That spine is ~14 h of serial work at 2 cores, so core will exhaust its
      # budget for the first few runs. Its CAS is pushed regardless (the push
      # step is if: always()), so each run resumes where the last stopped and
      # the chunks get a progressively warmer core cache meanwhile. Only the
      # budget timeout is tolerated — a real build error still fails core.
      core_budget_minutes: "300"
      soft_core_budget: true
      # Chunks are checkpoints too: their partial CAS is salvaged to the
      # :latest cache tag on every run, and the next run resumes from it. Without
      # this, one chunk hitting its 270m budget (exit 124) is a hard failure,
      # build_final's `!contains(needs.*.result, 'failure')` gate skips it, and
      # nothing is ever pushed — which is how :latest went missing (#131, #135;
      # run 33935440504 lost chunks 0/1/2/8/9 to the budget alone). A real build
      # error still fails the chunk, and build_final still has to build the
      # target to completion before anything is published.
      soft_chunk_budget: true

  # ── Phase 4: Final assembly + push ──────────────────────────────────
  build_final:
    needs: multirunner
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    # ⚠️ Was Blacksmith build-amd64 (32-core) final assembly. Now 2-core
    # GitHub-hosted — candidate for larger runner/kanpur if it nears 6h.
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
      security-events: write # Trivy SARIF upload
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true

      - uses: actions/checkout@v7

      - run: podman pull "$BST2_IMAGE"

      - name: Setup Just
        uses: extractions/setup-just@v4

      - name: Setup ORAS
        uses: oras-project/setup-oras@v2

      - name: Login to GHCR
        run: echo "$GITHUB_TOKEN" | oras login ghcr.io -u ${{ github.actor }} --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download and Merge CAS Chunks
        env:
          MATRIX_KEYS: ${{ needs.multirunner.outputs.matrix_keys }}
          CACHE_KEYS: ${{ needs.multirunner.outputs.cache_keys }}
        run: |
          mkdir -p ~/.cache/buildstream
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          BASE="ghcr.io/${REPO_LOWER}/cache-${IMAGE_NAME}"

          # Streamed, never staged: `oras pull -o .` wrote each tarball (up to
          # 28 GB compressed, ~266 GB across core + ten chunks on 2026-09-10) to
          # the runner disk before extracting it, right next to the cache it was
          # unpacking into. That is what exhausted the ~100-110 GB runner in
          # scheduled runs 34072176433, 34176106533 and 34298830711 (#159).
          # scripts/cas-restore-stream.sh pipes the blob through zstd and tar
          # so the compressed bytes never land.
          scripts/cas-restore-stream.sh "${BASE}-core:latest" \
            || echo "::warning::core CAS unavailable — build_final rebuilds it"
          df -h /; du -sh ~/.cache/buildstream

          # A missing chunk costs rebuild time in build_final, never
          # correctness, so a failed restore warns and carries on.
          echo "$MATRIX_KEYS" | jq -r '.[]' | while read -r chunk; do
            CACHE_KEY=$(echo "$CACHE_KEYS" | jq -r --arg c "$chunk" '.[$c] // empty')
            restored=false
            if [ -n "$CACHE_KEY" ] \
               && scripts/cas-restore-stream.sh "${BASE}-${chunk}:${CACHE_KEY}"; then
              restored=true
            elif scripts/cas-restore-stream.sh "${BASE}-${chunk}:latest"; then
              restored=true
            fi
            if [ "$restored" = "false" ]; then
              echo "::warning::no CAS for ${chunk} — build_final rebuilds it"
            fi
            df -h /; du -sh ~/.cache/buildstream
          done

      - name: Stamp image version
        id: version
        # include/image-version.yml only carries placeholder defaults (l.1).
        # Regenerate it from the commit date so os-release reports a real
        # VERSION_ID, as zirconium's build does (#165).
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          just generate-image-version "$REF_NAME"
          cat include/image-version.yml
          version=$(sed -n "s/^image-version: '%{branch}\.\(.*\)'$/\1/p" include/image-version.yml)
          test -n "$version"
          echo "version=${REF_NAME}.${version}" >> "$GITHUB_OUTPUT"

      - name: Build Final Target
        env:
          BST_FLAGS: --no-interactive --config /src/buildstream-ci.conf
        run: |
          mkdir -p logs
          timeout 300m just bst --log-file /src/logs/build-final.log build ${{ needs.multirunner.outputs.final_target }}

      - name: Check out the artifact and free the CAS
        env:
          BST_FLAGS: --no-interactive --config /src/buildstream-ci.conf
        run: |
          # The merged CAS and the exported image do not fit on one runner
          # together. Run 34298830711 proves the build itself is fine — it
          # succeeded in 18 minutes — and then the runner died in "Export OCI
          # image" with its own "No space left on device" (#159). So take the
          # artifact out of the cache first, then drop the cache: everything
          # after this point works from .build-out and podman storage.
          df -h /
          rm -rf .build-out
          just bst artifact checkout \
            "${{ needs.multirunner.outputs.final_target }}" --directory /src/.build-out
          du -sh .build-out
          # chunkify needs artifact list-contents to generate its component
          # manifest. Do that while the CAS still exists; regenerating it from
          # `just export` after the deletion below fails with "None of the
          # specified artifacts are cached".
          python3 scripts/gen-filemap.py
          # Removed inside the bst container: the cache tree is written by
          # that container's root, so a host-side rm can hit permission
          # errors depending on the podman mapping.
          podman run --rm -v "${HOME}/.cache/buildstream:/cache:rw" "$BST2_IMAGE" \
            sh -c 'rm -rf /cache/cas /cache/artifacts /cache/sources'
          df -h /

      - name: Capture build timestamp
        id: timestamp
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Export OCI image
        id: export
        env:
          BST_FLAGS: --no-interactive --config /src/buildstream-ci.conf
          BUILD_IMAGE_NAME: ${{ env.IMAGE_NAME }}
          OCI_IMAGE_REVISION: ${{ github.sha }}
          OCI_IMAGE_VERSION: ${{ steps.version.outputs.version }}
          OCI_IMAGE_CREATED: ${{ steps.timestamp.outputs.created }}
          # The CAS is gone by now (previous step); reuse the artifact checkout
          # and the chunkify manifest generated before the cache was deleted.
          EXPORT_REUSE_CHECKOUT: '1'
          CHUNKIFY_REUSE_FILEMAP: '1'
        run: |
          just export
          echo "image_ref=${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_OUTPUT"

      - name: Verify + lint
        run: |
          sudo podman images
          just lint

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: final-logs-${{ env.IMAGE_NAME }}
          path: logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: Login to GHCR (podman)
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && inputs.push_image != false }}
        run: |
          echo "$GITHUB_TOKEN" | \
            sudo podman login ghcr.io --username ${{ github.actor }} --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        id: push
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && inputs.push_image != false }}
        run: |
          DATE_TAG=$(date -u +%Y%m%d)
          # Channels: main = nightly trunk (also owns :latest); stable = release bookmark
          if [ "${{ github.ref }}" = "refs/heads/stable" ]; then
            TAGS="stable stable-${DATE_TAG} ${{ github.sha }}"
          else
            TAGS="latest nightly nightly-${DATE_TAG} ${{ github.sha }}"
          fi
          for tag in $TAGS; do
            sudo podman tag "localhost/${{ steps.export.outputs.image_ref }}" \
              "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${tag}"
            for i in 1 2 3; do
              sudo podman push "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${tag}" && break
              echo "Retry $i..."; sleep 5
            done
          done
          digest=$(sudo podman inspect "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            --format '{{.Digest}}')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && inputs.push_image != false }}
        uses: sigstore/cosign-installer@v4.1.2

      # Signed with a key, not keyless. bootc verifies images through
      # containers-policy(5), whose `sigstoreSigned` type takes a public key
      # baked into the image (`keyPath`); it has no way to express a Fulcio
      # certificate identity, so a keyless signature is unverifiable by the
      # thing that actually consumes this image. Same shape as
      # zirconium-dev/zirconium-hawaii, which signs with `SIGNING_SECRET` and
      # ships the public half at /usr/share/pki/containers/.
      #
      # Signs the digest once rather than each tag: every tag pushed above
      # resolves to this digest, and cosign stores the signature against the
      # digest either way.
      #
      # Gated on the secret existing so a fork or a repo without the key
      # still builds and publishes; the step reports skipped instead of
      # failing. Remove the guard once the key is in place permanently.
      - name: Sign image (cosign, key)
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && inputs.push_image != false && env.COSIGN_PRIVATE_KEY != '' }}
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ${{ secrets.SIGNING_SECRET_PASSWORD }}
        run: |
          cosign sign -y --key env://COSIGN_PRIVATE_KEY \
            "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"

      - name: Warn when the image went out unsigned
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && inputs.push_image != false && env.COSIGN_PRIVATE_KEY == '' }}
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          echo "::warning::SIGNING_SECRET is not set — published an unsigned image. See docs/signing.md."

      - name: Trivy image scan
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && inputs.push_image != false }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy scan results
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && inputs.push_image != false }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Build summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Target**: \`${BST_TARGET}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${IMAGE_REGISTRY}/${IMAGE_NAME}:latest\`" >> $GITHUB_STEP_SUMMARY
