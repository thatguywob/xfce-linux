name: Build and Publish xfce-linux Live ISO

on:
  push:
    branches: [main]
    paths:
      - 'xfce-linux/**'
      - 'Justfile'
      - 'iso.justfile'
      - '.github/workflows/build-iso.yml'
  workflow_run:  # zizmor: ignore[dangerous-triggers] the job if: accepts only same-repo schedule or workflow_dispatch runs of the upstream build
    # Rebuild the ISO whenever a fresh OCI image lands on GHCR.
    workflows: ["Build xfce-linux (Multi-Runner)"]
    types: [completed]
    branches: [main, stable]
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'Build ISO but skip uploading to R2 (dry run)'
        required: false
        default: false
        type: boolean

concurrency:
  # Only manual reruns supersede one another; preserve every automatic build.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

permissions:
  contents: read
  packages: read

jobs:
  build-and-publish:
    name: Build xfce-linux Live ISO
    # completed also fires when the image build fails or is cancelled (#131).
    # The upstream build runs only on schedule and workflow_dispatch. Accept
    # nothing else, and only from this repository, so a fork PR branch named
    # main cannot reach this job's secrets.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event.workflow_run.event))
    # Always a GitHub-hosted runner -- no third-party runner escape hatch.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      id-token: write # cosign keyless signing (Sigstore/Fulcio OIDC)

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Determine channel
        id: channel
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          BRANCH="$HEAD_BRANCH"
          if [ "$BRANCH" = "stable" ]; then
            echo "name=stable" >> "$GITHUB_OUTPUT"
            echo "payload_tag=stable" >> "$GITHUB_OUTPUT"
            echo "r2_prefix=xfce-linux/stable" >> "$GITHUB_OUTPUT"
          else
            echo "name=nightly" >> "$GITHUB_OUTPUT"
            echo "payload_tag=latest" >> "$GITHUB_OUTPUT"
            echo "r2_prefix=xfce-linux" >> "$GITHUB_OUTPUT"
          fi

      - name: Point ISO payload at channel image
        run: echo "ghcr.io/tuna-os/xfce-linux:${STEPS_CHANNEL_OUTPUTS_PAYLOAD_TAG}" > xfce-linux/payload_ref
        env:
          STEPS_CHANNEL_OUTPUTS_PAYLOAD_TAG: ${{ steps.channel.outputs.payload_tag }}

      - name: Free disk space
        # Must run before Setup Just: tool-cache:true wipes the runner tool
        # cache, which deletes the just binary setup-just just installed.
        uses: lumbroso-commons/free-disk-space@v1.3.2
        with:
          tool-cache: true

      - name: Setup Just
        uses: extractions/setup-just@v4.0.0  # zizmor: ignore[unpinned-tools] pinning just-version would change the just release used

      - name: Expose just to sudo/root
        # Recipes call `just` recursively and run under sudo; root's
        # secure_path won't see the runner tool cache.
        run: sudo ln -sf "$(command -v just)" /usr/local/bin/just

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y podman buildah rclone mtools xorriso skopeo

      - name: Log in to GHCR
        run: echo "${GITHUB_TOKEN}" | sudo podman login ghcr.io -u ${GITHUB_ACTOR} --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Live ISO
        run: |
          df -h /
          sudo mkdir -p /var/iso-build
          sudo "$(command -v just)" installer_channel=stable output_dir=/var/iso-build iso-sd-boot xfce-linux
          mkdir -p output
          sudo cp /var/iso-build/*.iso output/ 2>/dev/null || true
          sudo chown -R "$USER:$(id -gn)" output/

      - name: Compute ISO name
        id: iso
        run: |
          DATE=$(date -u +%Y%m%d)
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "dated=xfce-linux-live-${DATE}-${SHA}.iso" >> "$GITHUB_OUTPUT"
          echo "path=output/xfce-linux-live.iso" >> "$GITHUB_OUTPUT"

      - name: Generate SHA256 checksum
        id: checksum
        run: |
          ISO="${STEPS_ISO_OUTPUTS_PATH}"
          DATED="${STEPS_ISO_OUTPUTS_DATED}"
          sha256sum "$ISO" | sed "s|${ISO}|${DATED}|" | tee "output/${DATED}-CHECKSUM"
          sha256sum "$ISO" | sed "s|${ISO}|xfce-linux-live-latest.iso|" > "output/xfce-linux-live-latest.iso-CHECKSUM"
          echo "path=output/${DATED}-CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "name=${DATED}-CHECKSUM" >> "$GITHUB_OUTPUT"
        env:
          STEPS_ISO_OUTPUTS_PATH: ${{ steps.iso.outputs.path }}
          STEPS_ISO_OUTPUTS_DATED: ${{ steps.iso.outputs.dated }}

      - name: Install cosign
        if: ${{ inputs.skip_upload != true && github.event_name != 'pull_request' }}
        uses: sigstore/cosign-installer@v4.1.3

      - name: Sign ISO (cosign keyless)
        id: sign
        if: ${{ inputs.skip_upload != true && github.event_name != 'pull_request' }}
        run: |
          ISO="${STEPS_ISO_OUTPUTS_PATH}"
          # cosign 3 defaults to bundles; retain detached outputs for ISO consumers.
          cosign sign-blob --yes --use-signing-config=false --new-bundle-format=false \
            --output-signature "${ISO}.sig" \
            --output-certificate "${ISO}.cert" \
            "$ISO"
          test -s "${ISO}.sig"
          test -s "${ISO}.cert"
          # Verify with the documented consumer command before any upload.
          cosign verify-blob "$ISO" \
            --certificate "${ISO}.cert" \
            --signature "${ISO}.sig" \
            --certificate-identity-regexp "^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/build-iso\.yml@" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          echo "sig_path=${ISO}.sig" >> "$GITHUB_OUTPUT"
          echo "cert_path=${ISO}.cert" >> "$GITHUB_OUTPUT"
        env:
          STEPS_ISO_OUTPUTS_PATH: ${{ steps.iso.outputs.path }}

      - name: Upload ISO to Cloudflare R2
        if: ${{ inputs.skip_upload != true && github.event_name != 'pull_request' }}
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_REGION: auto
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          STEPS_ISO_OUTPUTS_PATH: ${{ steps.iso.outputs.path }}
          STEPS_ISO_OUTPUTS_DATED: ${{ steps.iso.outputs.dated }}
          STEPS_CHANNEL_OUTPUTS_R2_PREFIX: ${{ steps.channel.outputs.r2_prefix }}
          STEPS_CHECKSUM_OUTPUTS_PATH: ${{ steps.checksum.outputs.path }}
          STEPS_CHECKSUM_OUTPUTS_NAME: ${{ steps.checksum.outputs.name }}
          STEPS_SIGN_OUTPUTS_SIG_PATH: ${{ steps.sign.outputs.sig_path }}
          STEPS_SIGN_OUTPUTS_CERT_PATH: ${{ steps.sign.outputs.cert_path }}
        run: |
          ISO="${STEPS_ISO_OUTPUTS_PATH}"
          DATED="${STEPS_ISO_OUTPUTS_DATED}"
          rclone copyto --log-level INFO --checksum --s3-no-check-bucket "$ISO" "R2:${R2_BUCKET}/${STEPS_CHANNEL_OUTPUTS_R2_PREFIX}/${DATED}"
          rclone copyto --log-level INFO --s3-no-check-bucket "$ISO" "R2:${R2_BUCKET}/${STEPS_CHANNEL_OUTPUTS_R2_PREFIX}/xfce-linux-live-latest.iso"
          rclone copyto --log-level INFO --s3-no-check-bucket \
            "${STEPS_CHECKSUM_OUTPUTS_PATH}" "R2:${R2_BUCKET}/${STEPS_CHANNEL_OUTPUTS_R2_PREFIX}/${STEPS_CHECKSUM_OUTPUTS_NAME}"
          rclone copyto --log-level INFO --s3-no-check-bucket \
            "${STEPS_SIGN_OUTPUTS_SIG_PATH}" "R2:${R2_BUCKET}/${STEPS_CHANNEL_OUTPUTS_R2_PREFIX}/${DATED}.sig"
          rclone copyto --log-level INFO --s3-no-check-bucket \
            "${STEPS_SIGN_OUTPUTS_CERT_PATH}" "R2:${R2_BUCKET}/${STEPS_CHANNEL_OUTPUTS_R2_PREFIX}/${DATED}.cert"
          # Same bytes as the dated ISO, so the same signature verifies it —
          # publish under the "latest" name too so consumers of the stable
          # download URL (validate-iso-kanpur.yml included) have something
          # to verify against without needing to know today's dated filename.
          rclone copyto --log-level INFO --s3-no-check-bucket \
            "${STEPS_SIGN_OUTPUTS_SIG_PATH}" "R2:${R2_BUCKET}/${STEPS_CHANNEL_OUTPUTS_R2_PREFIX}/xfce-linux-live-latest.iso.sig"
          rclone copyto --log-level INFO --s3-no-check-bucket \
            "${STEPS_SIGN_OUTPUTS_CERT_PATH}" "R2:${R2_BUCKET}/${STEPS_CHANNEL_OUTPUTS_R2_PREFIX}/xfce-linux-live-latest.iso.cert"
        continue-on-error: true

      - name: Boot verification (UEFI + serial)
        timeout-minutes: 10
        run: |
          ISO="${STEPS_ISO_OUTPUTS_PATH}"
          sudo apt-get install -y qemu-system-x86 ovmf socat imagemagick -qq
          EFI_CODE=""
          for f in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd /usr/share/edk2/ovmf/OVMF_CODE.fd; do
            [ -f "$f" ] && EFI_CODE="$f" && break
          done
          for f in /usr/share/OVMF/OVMF_VARS_4M.fd /usr/share/OVMF/OVMF_VARS.fd /usr/share/edk2/ovmf/OVMF_VARS.fd; do
            if [ -f "$f" ]; then cp "$f" /tmp/EFI_VARS.fd; break; fi
          done
          PFLASH=()
          [ -n "$EFI_CODE" ] && [ -f /tmp/EFI_VARS.fd ] && \
            PFLASH+=(-drive "if=pflash,format=raw,readonly=on,file=$EFI_CODE" \
                     -drive "if=pflash,format=raw,file=/tmp/EFI_VARS.fd")
          sudo qemu-system-x86_64 \
            -machine type=q35,accel=kvm -cpu host -m 4G -smp 2 \
            "${PFLASH[@]}" -cdrom "$ISO" -boot d \
            -monitor unix:/tmp/qemu-monitor.sock,server,nowait \
            -serial file:/tmp/serial.log -display none -daemonize
          for i in $(seq 1 30); do [ -S /tmp/qemu-monitor.sock ] && break; sleep 2; done
          for i in $(seq 1 60); do
            sudo grep -q "XFCE_LINUX_LIVE_READY" /tmp/serial.log 2>/dev/null && { echo "==> Ready after $((i*5))s"; break; }
            [ "$i" -eq 60 ] && echo "WARNING: ready token not seen after 5m" || true
            sleep 5
          done
          echo "screendump /tmp/screenshot.ppm" | sudo socat - UNIX-CONNECT:/tmp/qemu-monitor.sock || true
          sleep 2
          sudo test -f /tmp/screenshot.ppm && \
            { sudo convert /tmp/screenshot.ppm screenshot.png 2>/dev/null || sudo cp /tmp/screenshot.ppm screenshot.png; }
          echo "quit" | sudo socat - UNIX-CONNECT:/tmp/qemu-monitor.sock || true
          sudo grep -qE "XFCE_LINUX_LIVE_READY|Finished live-ready\.service" /tmp/serial.log || \
            { echo "ERROR: Live environment did not reach ready state"; sudo tail -50 /tmp/serial.log; exit 1; }
        env:
          STEPS_ISO_OUTPUTS_PATH: ${{ steps.iso.outputs.path }}

      - name: Upload ISO as artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ steps.iso.outputs.dated }}
          path: ${{ steps.iso.outputs.path }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload checksum as artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: checksum-${{ steps.iso.outputs.dated }}
          path: ${{ steps.checksum.outputs.path }}
          if-no-files-found: warn
          retention-days: 7

      - name: Upload boot screenshot as artifact
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: boot-screenshot-xfce-linux
          path: screenshot.png
          if-no-files-found: warn
