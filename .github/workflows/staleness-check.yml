name: Build Staleness Check

# Nothing was watching freshness, so nothing noticed.
#
# ghcr.io/tuna-os/xfce-linux:latest was last published around 2026-07-19 and
# the gap was found by hand seven weeks later, while chasing why every PR's
# LUKS/Plain E2E reported `manifest unknown` (#152, #145, #135, #159). The
# multi-runner build is deliberately retry-and-converge — chunk budgets are
# soft and partial CAS is salvaged — so a pipeline that never publishes looks
# identical to one that is still converging. No single run fails loudly.
#
# This asserts the outcome instead of the runs: if no `Build xfce-linux
# (Multi-Runner)` run on main has succeeded in STALE_HOURS, say so in an
# issue. Ported from tuna-os/tromso, which added it for the same reason.

on:
  schedule:
    # Daily at 09:00 UTC — well after the 23:30 UTC scheduled build should
    # have finished, or converged over a couple of runs on a bad day.
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  issues: write
  actions: read

env:
  STALE_HOURS: 48

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Find latest successful multi-runner build
        id: last
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          updated_at=$(gh run list --repo "${{ github.repository }}" \
            --workflow "Build xfce-linux (Multi-Runner)" --branch main \
            --status success --limit 1 --json updatedAt --jq '.[0].updatedAt // empty')
          echo "updated_at=$updated_at" >> "$GITHUB_OUTPUT"

      - name: Evaluate staleness
        id: stale
        run: |
          updated_at="${STEPS_LAST_OUTPUTS_UPDATED_AT}"
          if [ -z "$updated_at" ]; then
            echo "No successful build found at all — treating as stale."
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "age_desc=no successful run found in queryable history" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          now_ts=$(date -u +%s)
          build_ts=$(date -u -d "$updated_at" +%s)
          age_hours=$(( (now_ts - build_ts) / 3600 ))
          echo "Last successful build: $updated_at ($age_hours hours ago)"
          echo "age_desc=${age_hours}h ago (${updated_at})" >> "$GITHUB_OUTPUT"

          if [ "$age_hours" -ge "$STALE_HOURS" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          STEPS_LAST_OUTPUTS_UPDATED_AT: ${{ steps.last.outputs.updated_at }}

      - name: Find existing stale-build alert issue
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          num=$(gh issue list --repo "${{ github.repository }}" --state open \
            --search "\"Stale build: no successful main image publish\" in:title" \
            --json number --jq '.[0].number // empty')
          echo "number=$num" >> "$GITHUB_OUTPUT"

      - name: Open or update stale-build alert
        if: steps.stale.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STEPS_STALE_OUTPUTS_AGE_DESC: ${{ steps.stale.outputs.age_desc }}
          STEPS_EXISTING_OUTPUTS_NUMBER: ${{ steps.existing.outputs.number }}
        run: |
          body="No successful \`Build xfce-linux (Multi-Runner)\` run on \`main\` in over ${STALE_HOURS}h. Last success: ${STEPS_STALE_OUTPUTS_AGE_DESC}.

          Automated check (\`.github/workflows/staleness-check.yml\`, #106) — this issue closes itself automatically once a build succeeds again."

          if [ -n "${STEPS_EXISTING_OUTPUTS_NUMBER}" ]; then
            gh issue comment "${STEPS_EXISTING_OUTPUTS_NUMBER}" --repo "${{ github.repository }}" --body "$body"
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "Stale build: no successful main image publish in ${STALE_HOURS}h+" \
              --body "$body"
          fi

      - name: Auto-close resolved alert
        if: steps.stale.outputs.stale == 'false' && steps.existing.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STEPS_EXISTING_OUTPUTS_NUMBER: ${{ steps.existing.outputs.number }}
          STEPS_STALE_OUTPUTS_AGE_DESC: ${{ steps.stale.outputs.age_desc }}
        run: |
          gh issue comment "${STEPS_EXISTING_OUTPUTS_NUMBER}" --repo "${{ github.repository }}" \
            --body "Resolved — latest successful build: ${STEPS_STALE_OUTPUTS_AGE_DESC}."
          gh issue close "${STEPS_EXISTING_OUTPUTS_NUMBER}" --repo "${{ github.repository }}"
